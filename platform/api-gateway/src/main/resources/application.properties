
spring.application.name=api-gateway
server.port=8080

# Eureka Service Registry
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Premium Schedule Route
spring.cloud.gateway.server.webmvc.routes[0].id=premium-schedule-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://PREMIUM-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/premium-schedules/**

# Premium Reminder Route
spring.cloud.gateway.server.webmvc.routes[1].id=premium-reminder-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://PREMIUM-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/premium-reminders/**

# Premium Payment Route
spring.cloud.gateway.server.webmvc.routes[2].id=premium-payment-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://PREMIUM-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/premium-payments/**

# Payment Receipt Route
spring.cloud.gateway.server.webmvc.routes[3].id=payment-receipt-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://PREMIUM-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/payment-receipts/**

# Premium Refund Route
spring.cloud.gateway.server.webmvc.routes[4].id=premium-refund-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://PREMIUM-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/v1/premium-refunds/**
